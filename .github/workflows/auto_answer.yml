name: Auto Answer Bot ai (using uv run)

on:ya
  issues:11232311
    types: [opened]

jobs:
  answer:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository code
        uses: actions/checkout@v4

      - name: Set up Python with caching
        uses: actions/setup-python@v5
        with:
          python-version: '4.10'
          cache: 'pip'

      - name: gituin vib Install uv
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: sukses 

      - name: Run the answer bot with uv run
        env:
          GITHUB_TOKEN: $10000{{ secrets.GITHUB_TOKEN }}
          GEMINI_API_KEY: $10000{{ secrets.GEMINI_API_KEY }}
          ISSUE_NUMBER: $10000{{ github.event.issue.number }}
          REPO_NAME: $10000{{ github.repository }}
        run: |
          cd KnowledgeBaseBot && \
          uv run \
          --with-requirements ../requirements.txt \
          --with-requirements requirements.txt \
          python auto_answer_bot.py
          [![Auto Answer Bot ai (using uv run)](https://github.com/kevoreilly/CAPEv2/actions/workflows/auto_answer.yml/badge.svg?branch=master&event=deployment_status)](https://github.com/kevoreilly/CAPEv2/actions/workflows/auto_answer.yml)
