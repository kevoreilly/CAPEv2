name: Python package

env:
  COLUMNS: 120

on:
  push:
    branches: [ master, staging ]
  pull_request:
    branches: [ master, staging ]

jobs:
  test:
    runs-on: ubuntu-22.04 # ubuntu-latest
    timeout-minutes: 20
    strategy:
      matrix:
        python-version: ["3.10", "3.14"]
    steps:
      - name: Check out repository code
        uses: actions/checkout@v4

      - name: Checkout test files repo
        uses: actions/checkout@v4
        with:
          repository: CAPESandbox/CAPE-TestFiles
          path: tests/data/

      - uses: ./.github/actions/python-setup/
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install pyattck
        run: |
          uv pip install git+https://github.com/CAPESandbox/pyattck

      - name: Run Ruff
        run: uv run ruff check . --output-format=github .

      - name: Run unit tests
        run: uv run python -m pytest --import-mode=append

      # The web/ Django suites (tenant-isolation, apiv2, guac, submission, ...) live
      # outside testpaths=["tests","agent"], so the arg-less run above never collects
      # them. They require importlib (append raises ImportPathMismatchError under
      # pythonpath=web); DJANGO_SETTINGS_MODULE + pythonpath come from pyproject's
      # [tool.pytest.ini_options] and still apply with an explicit path arg.
      - name: Run web unit tests
        run: uv run python -m pytest web/ --import-mode=importlib

      - name: Run Linux analyzer unit tests
        run: uv --project . --directory "analyzer/linux" run python -m pytest -v

      # see the ty configuration in pyproject.toml
      - name: Run ty
        run: uv run ty check

  format:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      matrix:
        python-version: ["3.10"]
    if: ${{ github.ref == 'refs/heads/master' }}

    steps:
      - name: Check out repository code
        uses: actions/checkout@v4

      - name: Set up python
        uses: ./.github/actions/python-setup
        with:
          python-version: ${{ matrix.python-version }}

      - name: Commit changes if any
        # Skip this step if being run by nektos/act
        if: ${{ !env.ACT }}
        run: |
          git config user.name "GitHub Actions"
          git config user.email "action@github.com"
          if output=$(git status --porcelain) && [ ! -z "$output" ]; then
            git pull
            git add .
            git commit -m "style: Automatic code formatting" -a
            git push
          fi
