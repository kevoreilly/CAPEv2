name: YARA tests

on:
  schedule:
  - cron: '0 8 * * 1'

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      matrix:
        python-version: ["3.14"]

    steps:
      - name: Check out repository code
        uses: actions/checkout@v7

      - name: Checkout test files repo
        uses: actions/checkout@v7
        with:
          repository: CAPESandbox/CAPE-TestFiles
          path: tests/data/

      - uses: ./.github/actions/python-setup/
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends automake libtool make gcc pkg-config libssl-dev libjansson-dev libmagic-dev
          uv pip install --python "$GITHUB_WORKSPACE/.venv/bin/python" --reinstall-package yara-python yara-python \
            --no-binary :all: \
            --config-setting="--global-option=build" \
            --config-setting="--global-option=--enable-cuckoo" \
            --config-setting="--global-option=--enable-magic" \
            --config-setting="--global-option=--enable-profiling"
          uv pip uninstall --python "$GITHUB_WORKSPACE/.venv/bin/python" yara-x || true

      - name: Run unit tests
        run: uv run pytest tests/test_yara.py -s --import-mode=append
