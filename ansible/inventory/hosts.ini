; CAPEv2 Ansible Inventory
; ========================
; This file is gitignored. Copy from hosts.ini.example and customize.
;
; Usage:
;   ansible-playbook -i inventory/hosts.ini playbooks/single-node.yml

; ────────────────────────────────────────────────────────────────────
; CONTROL NODE
; ────────────────────────────────────────────────────────────────────
[cape_control]
cape-master ansible_host=172.25.2.2

; ────────────────────────────────────────────────────────────────────
; WEB NODE
; ────────────────────────────────────────────────────────────────────
[cape_web:children]
cape_control

; ────────────────────────────────────────────────────────────────────
; WORKER NODES
; ────────────────────────────────────────────────────────────────────
[cape_worker]
; worker-1 ansible_host=10.0.0.20

; ────────────────────────────────────────────────────────────────────
; HOST
; ────────────────────────────────────────────────────────────────────
[cape_host:children]
cape_control
cape_worker

; ────────────────────────────────────────────────────────────────────
; GUEST VMs (metadata for VM creation — not SSH targets)
; ────────────────────────────────────────────────────────────────────
[cape_guests]
win10-1 libvirt_name=win10_1 guest_ip=192.168.1.101 guest_mac=52:54:00:ca:fe:01 vm_ram_mb=8192 vm_cpu=4 vm_disk_gb=64 vm_os_variant=win10 vm_wim_index=6
; win10-2 libvirt_name=win10_2 guest_ip=192.168.1.102 vm_ram_mb=4096 vm_cpu=2 vm_disk_gb=64 vm_os_variant=win10 vm_wim_index=6

; ────────────────────────────────────────────────────────────────────
; GUEST VMs — WinRM connection (for remote management, Sysmon, etc.)
; ────────────────────────────────────────────────────────────────────
; Populate this group after the initial Windows VM setup.
; WinRM is enabled automatically by Autounattend.xml (specialize pass).
; Install pywinrm on the control node: pip install pywinrm
;
; Example:
; win10-1 ansible_host=192.168.1.101 ansible_user=cape ansible_password=cape
;          ansible_connection=winrm ansible_winrm_transport=basic
;          ansible_winrm_server_cert_validation=ignore
;          sysmon_install=true
[cape_guests_winrm]

; ────────────────────────────────────────────────────────────────────
; DEFAULT CONNECTION SETTINGS
; ────────────────────────────────────────────────────────────────────
[all:vars]
ansible_user=root
ansible_python_interpreter=/usr/bin/python3
ansible_ssh_common_args=-o ControlMaster=auto -o ControlPersist=60s
