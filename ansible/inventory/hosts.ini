; CAPEv2 Ansible Inventory
; ========================
; Two deployment modes supported:
;   single — all services on one host (default)
;   multi  — control/web and workers on separate hosts
;
; Override deployment_mode in group_vars/all.yml or via -e.
;
; Usage:
;   ansible-playbook -i inventory/hosts.ini site.yml
;   ansible-playbook -i inventory/hosts.ini site.yml -e deployment_mode=multi
;   bash ansible-deploy.sh                           # wrapper (syntax + dry-run + confirm)
;   bash ansible-deploy.sh --check                   # syntax + dry-run only
;   bash ansible-deploy.sh --skip-tags optional      # skip optional components

; ────────────────────────────────────────────────────────────────────
; CONTROL NODE — always present, runs web UI, database, scheduler
; ────────────────────────────────────────────────────────────────────
[cape_control]
cape-master ansible_host=172.25.2.2

; ────────────────────────────────────────────────────────────────────
; WEB NODE — alias for control node (web services only in multi-mode)
; ────────────────────────────────────────────────────────────────────
[cape_web:children]
cape_control

; ────────────────────────────────────────────────────────────────────
; WORKER NODES — processing, signatures, VM management
; Empty in single-node mode; populate for multi-node deployments
; ────────────────────────────────────────────────────────────────────
[cape_worker]
; worker-1 ansible_host=10.0.0.20
; worker-2 ansible_host=10.0.0.21

; ────────────────────────────────────────────────────────────────────
; HOST — union of control + worker (target group for host-deploy.yml)
; ────────────────────────────────────────────────────────────────────
[cape_host:children]
cape_control
cape_worker

; ────────────────────────────────────────────────────────────────────
; GUEST VMs — Windows analysis targets managed via libvirt
; These entries are metadata references, not SSH targets.
; Guest provisioning generates manual scripts (see generated_guest_scripts/).
; ────────────────────────────────────────────────────────────────────
[cape_guests]
; <label> libvirt_name=<domain_name> guest_ip=<ip_on_virbr1>
win10-1 libvirt_name=win10_1 guest_ip=192.168.1.101
; win10-2 libvirt_name=win10_2 guest_ip=192.168.1.102

; ────────────────────────────────────────────────────────────────────
; DEFAULT CONNECTION SETTINGS
; ────────────────────────────────────────────────────────────────────
[all:vars]
ansible_user=root
ansible_python_interpreter=/usr/bin/python3
ansible_ssh_common_args=-o ControlMaster=auto -o ControlPersist=60s
