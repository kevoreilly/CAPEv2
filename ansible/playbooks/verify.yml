---
- name: Verify CAPEv2 deployment
  hosts: cape_host
  gather_facts: true
  vars:
    verify_services:
      - postgresql
      - tor
      - cape
      - cape-rooter
      - cape-processor
      - suricata
    verify_optional_services:
      - mongodb
      - nginx
      - guacd
      - guac-web
      - clamav-daemon
      - fail2ban
      - grafana-server
      - crowdsec

  tasks:
    - name: Check required services are active
      ansible.builtin.systemd:
        name: "{{ item }}"
      register: svc_result
      loop: "{{ verify_services }}"
      failed_when: svc_result.status.ActiveState not in ['active', 'activating']
      when: item not in ['tor', 'mongodb', 'clamav-daemon'] or
            (item == 'mongodb' and mongo_enable | default(false)) or
            (item == 'clamav-daemon' and clamav_enable | default(false))

    - name: Check optional services if enabled
      ansible.builtin.systemd:
        name: "{{ item }}"
      register: opt_svc_result
      loop: "{{ verify_optional_services }}"
      failed_when: false

    - name: PostgreSQL accepts connections (best-effort)
      ansible.builtin.command:
        cmd: "psql -U {{ db_user | default('cape') }} -d {{ db_name | default('cape') }} -c 'SELECT 1' -h {{ db_host | default('localhost') }}"
      register: pg_check
      failed_when: false
      changed_when: false
      no_log: true
      environment:
        PGPASSWORD: "{{ vault_db_password | default('') }}"

    - name: MongoDB responds (best-effort)
      ansible.builtin.command:
        cmd: "mongosh --eval 'db.version()' --quiet"
      register: mongo_check
      failed_when: false
      changed_when: false
      when: mongo_enable | default(false)

    - name: YARA is installed (best-effort)
      ansible.builtin.command:
        cmd: yara --version
      register: yara_version_check
      changed_when: false
      failed_when: false

    - name: Print YARA version
      ansible.builtin.debug:
        msg: "YARA version: {{ yara_version_check.stdout }}"

    - name: Suricata is configured on correct interface
      ansible.builtin.shell:
        cmd: "grep 'interface:' /etc/suricata/suricata.yaml | head -1"
      register: suricata_iface
      changed_when: false

    - name: Tor control port is listening
      ansible.builtin.wait_for:
        port: "{{ tor_control_port | default(9051) }}"
        host: "{{ iface_ip | default(ansible_default_ipv4.address) }}"
        timeout: 5
      failed_when: false

    - name: Tor DNS port is listening
      ansible.builtin.wait_for:
        port: "{{ tor_dns_port | default(5353) }}"
        host: "{{ iface_ip | default(ansible_default_ipv4.address) }}"
        timeout: 5
      failed_when: false

    - name: Result server port is listening
      ansible.builtin.wait_for:
        port: "{{ resultserver_port | default(8000) }}"
        host: "{{ iface_ip | default(ansible_default_ipv4.address) }}"
        timeout: 5
      failed_when: false

    - name: Web UI responds (best-effort; CAPE may not be fully running)
      ansible.builtin.uri:
        url: "http://{{ iface_ip | default(ansible_default_ipv4.address) }}:8000/"
        return_content: true
      register: web_check
      failed_when: false

    - name: All checks passed
      ansible.builtin.debug:
        msg: "✅ All verification checks passed."
