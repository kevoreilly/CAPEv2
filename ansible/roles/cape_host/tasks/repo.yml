---
- name: Download CAPEv2 source tarball
  ansible.builtin.get_url:
    url: "https://github.com/kevoreilly/CAPEv2/archive/master.tar.gz"
    dest: "/tmp/CAPEv2-master.tar.gz"
    timeout: 120

- name: Extract CAPEv2 tarball
  ansible.builtin.unarchive:
    src: "/tmp/CAPEv2-master.tar.gz"
    dest: "{{ cape_root | dirname }}"
    remote_src: true

- name: Rename extracted directory to cape_root
  ansible.builtin.shell:
    cmd: |
      rm -rf "{{ cape_root }}" &&
      mv "{{ cape_root | dirname }}/CAPEv2-master" "{{ cape_root }}"
  args:
    executable: /bin/bash
    creates: "{{ cape_root }}/pyproject.toml"

- name: Ensure CAPE root ownership
  ansible.builtin.file:
    path: "{{ cape_root }}"
    state: directory
    owner: "{{ cape_user }}"
    group: "{{ cape_user }}"
    recurse: true

- name: Create Python virtual environment with uv
  ansible.builtin.command:
    cmd: >
      /usr/local/bin/uv venv "{{ cape_root }}/.venv"
    creates: "{{ cape_root }}/.venv/pyvenv.cfg"
  become: true
  become_user: "{{ cape_user }}"
  when: use_uv

- name: Create Python virtual environment with Poetry
  ansible.builtin.command:
    cmd: >
      /etc/poetry/bin/poetry config virtualenvs.in-project true
    creates: "{{ cape_root }}/.venv/pyvenv.cfg"
  become: true
  become_user: "{{ cape_user }}"
  when: not use_uv

- name: Sync dependencies with uv
  ansible.builtin.command:
    cmd: /usr/local/bin/uv sync --no-install-project
    chdir: "{{ cape_root }}"
  become: true
  become_user: "{{ cape_user }}"
  environment:
    PYTHON_KEYRING_BACKEND: keyring.backends.null.Keyring
    CRYPTOGRAPHY_DONT_BUILD_RUST: "1"
  when: use_uv

- name: Install CAPE dependency build requirements
  ansible.builtin.apt:
    pkg:
      - libpq-dev
      - libxslt1-dev
      - libre2-dev
      - python3-greenlet
      - python3-gevent
      - python3-psycopg2
    state: present

- name: Sync dependencies with Poetry (may fail on Python 3.14 — upstream incompatibility)
  ansible.builtin.command:
    cmd: /etc/poetry/bin/poetry install
    chdir: "{{ cape_root }}"
  become: true
  become_user: "{{ cape_user }}"
  environment:
    PYTHON_KEYRING_BACKEND: keyring.backends.null.Keyring
    CRYPTOGRAPHY_DONT_BUILD_RUST: "1"
  ignore_errors: true
  when: not use_uv

# Poetry's venv is isolated from system site-packages, so apt-installed
# python3-greenlet/python3-gevent aren't visible to it. The poetry.lock
# pins old versions (greenlet 3.0.3, gevent 24.2.1, orjson 3.10.15) that
# lack Python 3.14 wheels and fail to compile from source. Install them
# directly via pip to get prebuilt cp314 wheels from PyPI.
- name: Install native packages into Poetry venv for Python 3.14 compatibility
  ansible.builtin.command:
    cmd: /opt/CAPEv2/.venv/bin/pip install gevent greenlet orjson --break-system-packages
  become: true
  become_user: "{{ cape_user }}"
  changed_when: false
  failed_when: false
  when: not use_uv

- name: Install libvirt Python bindings
  ansible.builtin.apt:
    pkg:
      - python3-libvirt
    state: present

- name: Create .venv site-packages directory for libvirt .pth
  ansible.builtin.file:
    path: /opt/CAPEv2/.venv/lib/python3.14/site-packages
    state: directory
    mode: "0755"
  when: not use_uv
  failed_when: false

- name: Make libvirt accessible from Poetry venv
  ansible.builtin.copy:
    dest: /opt/CAPEv2/.venv/lib/python3.14/site-packages/libvirt.pth
    content: "/usr/local/lib/python3.14/dist-packages\n"
    mode: "0644"
  when: not use_uv
  failed_when: false

- name: Install yara-python system dependencies
  ansible.builtin.apt:
    pkg:
      - libjansson-dev
      - libmagic1
      - libmagic-dev
    state: present

- name: Install yara-python with uv
  ansible.builtin.command:
    cmd: >
      /usr/local/bin/uv pip install yara-python
      --no-binary :all:
    chdir: "{{ cape_root }}"
  become: true
  become_user: "{{ cape_user }}"
  when: use_uv

- name: Install yara-python with Poetry
  ansible.builtin.command:
    cmd: >
      /etc/poetry/bin/poetry run pip install yara-python
      --no-binary :all:
      --config-settings="--global-option=build"
      --config-settings="--global-option=--enable-cuckoo"
      --config-settings="--global-option=--enable-magic"
      --config-settings="--global-option=--enable-profiling"
    chdir: "{{ cape_root }}"
  become: true
  become_user: "{{ cape_user }}"
  when: not use_uv
