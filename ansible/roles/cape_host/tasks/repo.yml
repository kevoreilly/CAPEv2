---
- name: Clone CAPEv2 repository
  ansible.builtin.git:
    repo: "{{ cape_repo_url }}"
    dest: "{{ cape_root }}"
    version: master
    force: true
  become: true
  become_user: "{{ cape_user }}"
  register: cape_clone_result
  ignore_errors: true

- name: Fallback to tarball when git clone fails
  block:
    - name: Check if git clone actually succeeded
      ansible.builtin.stat:
        path: "{{ cape_root }}/.git"
      register: cape_git_dir
      when: cape_clone_result is failed

    - name: Download CAPEv2 source tarball
      ansible.builtin.get_url:
        url: "https://github.com/kevoreilly/CAPEv2/archive/master.tar.gz"
        dest: "/tmp/CAPEv2-master.tar.gz"
        timeout: 120
      when: cape_git_dir is defined and not (cape_git_dir.stat.exists | default(false))

    - name: Extract CAPEv2 tarball
      ansible.builtin.unarchive:
        src: "/tmp/CAPEv2-master.tar.gz"
        dest: "{{ cape_root | dirname }}"
        remote_src: true
      when: cape_git_dir is defined and not (cape_git_dir.stat.exists | default(false))

    - name: Rename extracted directory to cape_root
      ansible.builtin.command:
        cmd: mv "{{ cape_root | dirname }}/CAPEv2-master" "{{ cape_root }}"
        creates: "{{ cape_root }}"
      when: cape_git_dir is defined and not (cape_git_dir.stat.exists | default(false))

    - name: Ensure CAPE root ownership
      ansible.builtin.file:
        path: "{{ cape_root }}"
        state: directory
        owner: "{{ cape_user }}"
        group: "{{ cape_user }}"
        recurse: true
      when: cape_git_dir is defined and not (cape_git_dir.stat.exists | default(false))
  when: cape_clone_result is failed

- name: Ensure CAPE root ownership
  ansible.builtin.file:
    path: "{{ cape_root }}"
    state: directory
    owner: "{{ cape_user }}"
    group: "{{ cape_user }}"
    recurse: true

- name: Create Python virtual environment with uv
  ansible.builtin.command:
    cmd: >
      /usr/local/bin/uv venv "{{ cape_root }}/.venv"
    creates: "{{ cape_root }}/.venv/pyvenv.cfg"
  become: true
  become_user: "{{ cape_user }}"
  when: use_uv

- name: Create Python virtual environment with Poetry
  ansible.builtin.command:
    cmd: >
      /etc/poetry/bin/poetry config virtualenvs.in-project true
    creates: "{{ cape_root }}/.venv/pyvenv.cfg"
  become: true
  become_user: "{{ cape_user }}"
  when: not use_uv

- name: Sync dependencies with uv
  ansible.builtin.command:
    cmd: /usr/local/bin/uv sync --no-install-project
    chdir: "{{ cape_root }}"
  become: true
  become_user: "{{ cape_user }}"
  environment:
    PYTHON_KEYRING_BACKEND: keyring.backends.null.Keyring
    CRYPTOGRAPHY_DONT_BUILD_RUST: "1"
  when: use_uv

- name: Sync dependencies with Poetry
  ansible.builtin.command:
    cmd: /etc/poetry/bin/poetry install
    chdir: "{{ cape_root }}"
  become: true
  become_user: "{{ cape_user }}"
  environment:
    PYTHON_KEYRING_BACKEND: keyring.backends.null.Keyring
    CRYPTOGRAPHY_DONT_BUILD_RUST: "1"
  when: not use_uv

- name: Install yara-python system dependencies
  ansible.builtin.apt:
    pkg:
      - libjansson-dev
      - libmagic1
      - libmagic-dev
    state: present

- name: Install yara-python with uv
  ansible.builtin.command:
    cmd: >
      /usr/local/bin/uv pip install yara-python
      --no-binary :all:
    chdir: "{{ cape_root }}"
  become: true
  become_user: "{{ cape_user }}"
  when: use_uv

- name: Install yara-python with Poetry
  ansible.builtin.command:
    cmd: >
      /etc/poetry/bin/poetry run pip install yara-python
      --no-binary :all:
      --config-settings="--global-option=build"
      --config-settings="--global-option=--enable-cuckoo"
      --config-settings="--global-option=--enable-magic"
      --config-settings="--global-option=--enable-profiling"
    chdir: "{{ cape_root }}"
  become: true
  become_user: "{{ cape_user }}"
  when: not use_uv
