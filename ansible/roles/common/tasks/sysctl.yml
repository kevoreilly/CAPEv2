---
- name: Write sysctl configuration for CAPE
  ansible.builtin.copy:
    dest: /etc/sysctl.d/99-cape.conf
    content: |
      # CAPEv2 system tuning
      fs.file-max = 10000000
      net.ipv4.ip_forward = 1
      net.bridge.bridge-nf-call-arptables = 0
      net.bridge.bridge-nf-call-ip6tables = 0
      net.bridge.bridge-nf-call-iptables = 0
      net.core.rmem_max = 16777216
      net.core.wmem_max = 16777216
      net.ipv4.tcp_rmem = 4096 87380 16777216
      net.ipv4.tcp_wmem = 4096 65536 16777216
      net.ipv4.tcp_syncookies = 0
      net.ipv4.tcp_mem = 50576 64768 98152
      net.core.netdev_max_backlog = 2500
      vm.swappiness = 1
      vm.dirty_ratio = 15
      net.ipv6.conf.all.disable_ipv6 = 1
      net.ipv6.conf.default.disable_ipv6 = 1
    mode: "0644"

- name: Load tcp_bbr module
  ansible.builtin.command:
    cmd: modprobe tcp_bbr
  changed_when: false
  failed_when: false
  register: bbr_module

- name: Enable BBR congestion control
  ansible.builtin.sysctl:
    name: net.ipv4.tcp_congestion_control
    value: bbr
    state: present
    reload: true
  when: bbr_module.rc == 0

- name: Keep IPv6 on loopback
  ansible.builtin.sysctl:
    name: net.ipv6.conf.lo.disable_ipv6
    value: "0"
    state: present
    reload: true

- name: Apply sysctl settings
  ansible.builtin.command:
    cmd: sysctl --system
  changed_when: false

- name: Write limits configuration for cape user
  ansible.builtin.copy:
    dest: /etc/security/limits.d/99-cape.conf
    content: |
      # CAPEv2 limits
      {{ cape_user }}  hard  nofile  1048576
      {{ cape_user }}  soft  nofile  1048576
    mode: "0644"

- name: Load br_netfilter module
  ansible.builtin.copy:
    dest: /etc/modules-load.d/cape.conf
    content: |
      br_netfilter
    mode: "0644"

- name: Ensure br_netfilter is loaded now
  ansible.builtin.command:
    cmd: modprobe br_netfilter
  changed_when: false
  failed_when: false
