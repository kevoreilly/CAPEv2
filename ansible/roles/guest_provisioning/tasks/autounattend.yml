---
# ────────────────────────────────────────────────────────────────────
# Generate answer floppy for unattended Windows installation
#
# Renders Autounattend.xml + postinstall.ps1, then packs them into
# a FAT floppy image. The floppy is attached to the virt-install
# command in vm_create.yml. Floppy is more reliably detected by
# Windows setup than a secondary CDROM.
#
# Variables expected:
#   ansible_host       — CAPE host IP (for VirtIO drivers download)
#   windows_iso_path   — path to Windows ISO on the host
#   windows_admin_password, windows_product_key, windows_locale
#   vm_wim_index       — WIM index for the desired Windows edition
# ────────────────────────────────────────────────────────────────────

- name: Create answer file staging directory
  ansible.builtin.tempfile:
    state: directory
    suffix: autounattend
  register: autounattend_tmp_dir

- name: Render Autounattend.xml from template
  ansible.builtin.template:
    src: Autounattend.xml.j2
    dest: "{{ autounattend_tmp_dir.path }}/Autounattend.xml"
    mode: "0644"

- name: Render postinstall.ps1 from template
  ansible.builtin.template:
    src: postinstall.ps1.j2
    dest: "{{ autounattend_tmp_dir.path }}/postinstall.ps1"
    mode: "0644"

- name: Create FAT floppy image for Windows answer file
  ansible.builtin.shell:
    cmd: >
      set -e &&
      dd if=/dev/zero of="{{ autounattend_tmp_dir.path }}/autounattend.img"
      bs=512 count=2880 status=none &&
      mkfs.fat "{{ autounattend_tmp_dir.path }}/autounattend.img" >/dev/null &&
      mount -o loop "{{ autounattend_tmp_dir.path }}/autounattend.img"
      /mnt &&
      cp "{{ autounattend_tmp_dir.path }}/Autounattend.xml"
      /mnt/ &&
      cp "{{ autounattend_tmp_dir.path }}/postinstall.ps1"
      /mnt/ &&
      umount /mnt
    executable: /bin/bash
  args:
    creates: "{{ autounattend_tmp_dir.path }}/autounattend.img"
