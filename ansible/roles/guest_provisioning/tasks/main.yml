---
# ════════════════════════════════════════════════════════════════════
# Epic 9: Guest VM Provisioning Scripts
# All scripts are written to {{ guest_scripts_dir }} on the control node.
# They must be manually copied to the guest VM and executed.
# ════════════════════════════════════════════════════════════════════

- name: Ensure guest scripts output directory exists
  ansible.builtin.file:
    path: "{{ guest_scripts_dir }}"
    state: directory
    mode: "0755"
  delegate_to: localhost
  become: false
  connection: local

# ────────────────────────────────────────────────────────────────────
# 9.1: OS hardening scripts
# ────────────────────────────────────────────────────────────────────

- name: Generate Windows hardening PowerShell script
  ansible.builtin.copy:
    dest: "{{ guest_scripts_dir }}/harden.ps1"
    content: |
      <#
      .SYNOPSIS
          CAPEv2 guest VM hardening script (PowerShell)
          Generated by Ansible — {{ ansible_date_time.iso8601 }}
      .DESCRIPTION
          Disables Windows Defender, Firewall, SmartScreen, telemetry,
          scheduled tasks, and other noisy services.
      #>

      Write-Output "=== CAPEv2 Guest Hardening (PowerShell) ==="

      Write-Output "Disabling Windows Defender..."
      New-ItemProperty -Path "HKLM:\SOFTWARE\Policies\Microsoft\Windows Defender" -Name DisableAntiSpyware -Value 1 -PropertyType DWORD -Force
      Set-MpPreference -DisableRealtimeMonitoring $true -DisableBehaviorMonitoring $true -DisableIOAVProtection $true -DisableIntrusionPreventionSystem $true -DisableScriptScanning $true -DisableRemovableDriveScanning $true -EnableControlledFolderAccess Disabled -EnableNetworkProtection AuditMode -Force -MAPSReporting Disabled -SubmitSamplesConsent NeverSend

      Write-Output "Disabling Windows Firewall..."
      Set-NetFirewallProfile -Profile Domain, Public, Private -Enabled False

      Write-Output "Disabling SmartScreen..."
      Set-ItemProperty -Path "HKLM:\SOFTWARE\Policies\Microsoft\Windows\System" -Name "EnableSmartScreen" -Type DWord -Value 0
      If (!(Test-Path "HKLM:\SOFTWARE\Policies\Microsoft\MicrosoftEdge\PhishingFilter")) {
          New-Item -Path "HKLM:\SOFTWARE\Policies\Microsoft\MicrosoftEdge\PhishingFilter" -Force | Out-Null
      }
      Set-ItemProperty -Path "HKLM:\SOFTWARE\Policies\Microsoft\MicrosoftEdge\PhishingFilter" -Name "EnabledV9" -Type DWord -Value 0

      Write-Output "Disabling telemetry..."
      New-Item -Path "HKLM:\SOFTWARE\Policies\Microsoft\Windows\DataCollection" -Force
      Set-ItemProperty -Path "HKLM:\SOFTWARE\Policies\Microsoft\Windows\DataCollection" "AllowTelemetry" 0

      Write-Output "Disabling scheduled telemetry tasks..."
      $tasks = @(
          "\Microsoft\Windows\Application Experience\Microsoft Compatibility Appraiser",
          "\Microsoft\Windows\Application Experience\ProgramDataUpdater",
          "\Microsoft\Windows\Application Experience\StartupAppTask",
          "\Microsoft\Windows\Application Experience\PcaPatchDbTask"
      )
      foreach ($task in $tasks) {
         Disable-ScheduledTask -TaskName $task
      }

      Write-Output "Hardening complete. A reboot is recommended."
    mode: "0644"
  delegate_to: localhost
  become: false
  connection: local
  tags: [guest, harden]

- name: Generate Windows hardening batch script
  ansible.builtin.copy:
    dest: "{{ guest_scripts_dir }}/harden.bat"
    content: |
      @echo off
      REM CAPEv2 guest VM hardening script (Batch)
      REM Generated by Ansible — {{ ansible_date_time.iso8601 }}

      echo === CAPEv2 Guest Hardening (Batch) ===

      REM Disable UAC
      reg add "HKLM\SOFTWARE\Microsoft\Windows\CurrentVersion\Policies\System" /v EnableLUA /t REG_DWORD /d 0 /f

      REM Disable Windows Defender
      sc config WinDefend start= disabled

      REM Disable Windows Update
      reg add "HKEY_LOCAL_MACHINE\SOFTWARE\Microsoft\Windows\CurrentVersion\WindowsUpdate\Auto Update" /v AUOptions /t REG_DWORD /d 1 /f

      REM Disable firewall
      netsh advfirewall set allprofiles state off

      REM Disable IPv6
      netsh interface teredo set state disabled
      netsh interface ipv6 6to4 set state state=disabled undoonstop=disabled
      netsh interface ipv6 isatap set state state=disabled

      REM Disable NetBIOS
      reg add "HKLM\SYSTEM\CurrentControlSet\services\Lmhosts" /v Start /t REG_DWORD /d 4 /f

      REM Disable LLMNR
      reg add "HKLM\Software\policies\Microsoft\Windows NT\DNSClient" /v "EnableMulticast" /t REG_DWORD /d 0 /f

      REM Disable telemetry
      reg add "HKEY_LOCAL_MACHINE\SOFTWARE\Policies\Microsoft\Windows\DataCollection" /v AllowTelemetry /t REG_DWORD /d 0 /f
      sc stop DiagTrack
      sc config DiagTrack start= disabled
      sc stop dmwappushservice
      sc config dmwappushservice start= disabled

      REM Disable monitor timeout
      POWERCFG -CHANGE -monitor-timeout-ac 0
      POWERCFG -CHANGE -monitor-timeout-dc 0

      echo Hardening complete. A reboot is recommended.
    mode: "0644"
  delegate_to: localhost
  become: false
  connection: local
  tags: [guest, harden]

# ────────────────────────────────────────────────────────────────────
# 9.2: Guest dependency installer
# ────────────────────────────────────────────────────────────────────

- name: Generate dependency installer script
  ansible.builtin.copy:
    dest: "{{ guest_scripts_dir }}/install_deps.ps1"
    content: |
      <#
      .SYNOPSIS
          CAPEv2 guest VM dependency installer (PowerShell)
          Generated by Ansible — {{ ansible_date_time.iso8601 }}
      .DESCRIPTION
          Installs Python, VC++ redistributable, and Python packages
          required by the CAPE agent.
      #>

      Write-Output "=== CAPEv2 Guest Dependency Installer ==="

      # Check if Python is installed
      $pyInstalled = $false
      try {
          $pyVersion = python --version 2>&1
          if ($pyVersion -match "{{ agent_python_version }}") {
              $pyInstalled = $true
              Write-Output "Python {{ agent_python_version }} already installed."
          } else {
              Write-Output "Python version mismatch: $pyVersion"
          }
      } catch {
          Write-Output "Python not found."
      }

      if (-not $pyInstalled) {
          Write-Output "Downloading Python {{ agent_python_version }}..."
          $url = "https://www.python.org/ftp/python/{{ agent_python_version }}/python-{{ agent_python_version }}-amd64.exe"
          $out = "$env:TEMP\python-installer.exe"
          [Net.ServicePointManager]::SecurityProtocol = [Net.SecurityProtocolType]::Tls12
          Invoke-WebRequest -Uri $url -OutFile $out
          Write-Output "Installing Python {{ agent_python_version }}..."
          Start-Process -Wait -FilePath $out -ArgumentList "/quiet InstallAllUsers=1 PrependPath=1 Include_test=0"
      }

      Write-Output "Installing pip packages..."
      pip3 install pillow pywintrace

      Write-Output "Dependency installation complete."
    mode: "0644"
  delegate_to: localhost
  become: false
  connection: local
  tags: [guest, deps]

# ────────────────────────────────────────────────────────────────────
# 9.3: Agent deploy script
# ────────────────────────────────────────────────────────────────────

- name: Ensure agent.py exists in CAPE root
  ansible.builtin.stat:
    path: "{{ cape_root }}/agent/agent.py"
  register: agent_py
  tags: [guest, agent]

- name: Generate agent deploy script
  ansible.builtin.copy:
    dest: "{{ guest_scripts_dir }}/deploy_agent.ps1"
    content: |
      <#
      .SYNOPSIS
          CAPEv2 agent deploy script (PowerShell)
          Generated by Ansible — {{ ansible_date_time.iso8601 }}
      .DESCRIPTION
          Copies agent.py to the guest, registers it as a Windows service,
          and tests connectivity to the result server.
      #>

      Write-Output "=== CAPEv2 Agent Deployment ==="

      $agentSource = ".\agent.py"
      $agentDest = "C:\ProgramData\cape\agent.py"
      $serviceName = "CAPEAgent"

      # Create destination directory
      if (-not (Test-Path "C:\ProgramData\cape")) {
          New-Item -ItemType Directory -Path "C:\ProgramData\cape" -Force
      }

      # Copy agent
      if (Test-Path $agentSource) {
          Copy-Item -Path $agentSource -Destination $agentDest -Force
          Write-Output "Agent copied to $agentDest"
      } else {
          Write-Error "agent.py not found at $agentSource. Copy agent.py from the CAPEv2 host before running this script."
          exit 1
      }

      # Check if service already exists
      $existing = Get-Service -Name $serviceName -ErrorAction SilentlyContinue
      if ($existing) {
          Write-Output "Service $serviceName already exists. Restarting..."
          Restart-Service -Name $serviceName
      } else {
          # Create service
          New-Service -Name $serviceName -BinaryPathName "python.exe $agentDest" -DisplayName "CAPEv2 Agent" -StartupType Automatic
          Write-Output "Service $serviceName created."
          Start-Service -Name $serviceName
      }

      # Test connectivity
      Write-Output "Testing connectivity to {{ resultserver_ip }}:{{ resultserver_port }}..."
      try {
          $tcp = New-Object System.Net.Sockets.TcpClient
          $tcp.Connect("{{ resultserver_ip }}", {{ resultserver_port }})
          Write-Output "Connection OK!"
          $tcp.Close()
      } catch {
          Write-Error "Cannot connect to {{ resultserver_ip }}:{{ resultserver_port }}. Check that the result server is running."
      }

      Write-Output "Agent deployment complete."
    mode: "0644"
  delegate_to: localhost
  become: false
  connection: local
  when: agent_py.stat.exists | default(false)
  tags: [guest, agent]

- name: Generate agent uninstall script
  ansible.builtin.copy:
    dest: "{{ guest_scripts_dir }}/uninstall_agent.ps1"
    content: |
      <#
      .SYNOPSIS
          CAPEv2 agent uninstall script (PowerShell)
          Generated by Ansible — {{ ansible_date_time.iso8601 }}
      .DESCRIPTION
          Stops and removes the CAPE agent service and cleans up files.
      #>

      Write-Output "=== CAPEv2 Agent Uninstall ==="

      $serviceName = "CAPEAgent"

      $existing = Get-Service -Name $serviceName -ErrorAction SilentlyContinue
      if ($existing) {
          Write-Output "Stopping service $serviceName..."
          Stop-Service -Name $serviceName -Force
          sc.exe delete $serviceName
          Write-Output "Service $serviceName removed."
      }

      $agentDest = "C:\ProgramData\cape\agent.py"
      if (Test-Path $agentDest) {
          Remove-Item -Path $agentDest -Force
          Write-Output "Removed $agentDest."
      }

      Write-Output "Agent uninstall complete."
    mode: "0644"
  delegate_to: localhost
  become: false
  connection: local
  when: agent_py.stat.exists | default(false)
  tags: [guest, agent]

# ────────────────────────────────────────────────────────────────────
# 9.4: Agent config.ini
# ────────────────────────────────────────────────────────────────────

- name: Generate agent config.ini
  ansible.builtin.copy:
    dest: "{{ guest_scripts_dir }}/config.ini"
    content: |
      [resultserver]
      ip = {{ resultserver_ip }}
      port = {{ resultserver_port }}

      [caps]
      # IP addresses to ignore for routing
      # ignore_ip = 192.168.1.1,8.8.8.8
    mode: "0644"
  delegate_to: localhost
  become: false
  connection: local
  tags: [guest, config]

# ────────────────────────────────────────────────────────────────────
# 9.5: Snapshot instructions
# ────────────────────────────────────────────────────────────────────

- name: Generate snapshot instructions
  ansible.builtin.copy:
    dest: "{{ guest_scripts_dir }}/SNAPSHOT_INSTRUCTIONS.md"
    content: |
      # CAPEv2 Guest VM Snapshot Instructions

      Generated by Ansible — {{ ansible_date_time.iso8601 }}

      ## Prerequisites

      - Windows guest VM installed and booted
      - Guest VM connected to the `{{ network_iface }}` bridge (192.168.1.0/24)
      - These scripts have been transferred to the guest VM
        (e.g., via SMB share, USB, or shared folder)

      ## Step-by-Step

      ### 1. Harden the Guest

      Open **PowerShell as Administrator** and run:

      ```
      Set-ExecutionPolicy Bypass -Scope Process -Force
      .\harden.ps1
      ```

      Or if PowerShell is not available, run as Administrator:

      ```
      harden.bat
      ```

      A reboot is recommended after hardening.

      ### 2. Install Dependencies

      After reboot, open **PowerShell as Administrator** and run:

      ```
      .\install_deps.ps1
      ```

      This installs Python {{ agent_python_version }}, VC++ redistributable,
      and required Python packages (pillow, pywintrace).

      ### 3. Configure the Agent

      Copy `config.ini` to `C:\ProgramData\cape\config.ini`.
      Adjust `ip` and `port` if your result server uses a different address.

      ### 4. Deploy the Agent

      Copy `agent.py` from the CAPEv2 host (`{{ cape_root }}/agent/agent.py`)
      to the same directory as `deploy_agent.ps1`, then run:

      ```
      .\deploy_agent.ps1
      ```

      This copies `agent.py`, registers it as a Windows service named `CAPEAgent`,
      starts the service, and tests TCP connectivity to `{{ resultserver_ip }}:{{ resultserver_port }}`.

      To remove the agent later, run:

      ```
      .\uninstall_agent.ps1
      ```

      ### 5. Shut Down and Snapshot

      Once the agent is running and connectivity is confirmed:

      1. Shut down the guest VM cleanly.
      2. On the CAPEv2 host, create a libvirt snapshot:

      ```bash
      virsh snapshot-create-as <vm-name> \
          --name "clean" \
          --description "Freshly hardened and agent-installed" \
          --disk-only --atomic
      ```

      If you prefer a full (RAM + disk) snapshot:

      ```bash
      virsh snapshot-create-as <vm-name> \
          --name "clean" \
          --description "Freshly hardened and agent-installed"
      ```

      ### 6. Update kvm.conf

      On the CAPEv2 host, edit `{{ cape_root }}/conf/kvm.conf` and set:

      ```ini
      machines = <vm-name>
      interface = {{ network_iface }}
      ip = {{ iface_ip }}
      snapshot = on
      ```

      ## Troubleshooting

      - If `deploy_agent.ps1` fails to connect, verify that `cape-rooter` and
        `cape` services are running on the host.
      - If the agent service crashes, check Windows Event Viewer and the agent
        log file at `C:\ProgramData\cape\agent.log`.
      - Ensure port `{{ resultserver_port }}` is reachable from the guest.
    mode: "0644"
  delegate_to: localhost
  become: false
  connection: local
  tags: [guest, instructions]
