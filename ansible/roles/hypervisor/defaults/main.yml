---
qemu_version: "9.2.2"
qemu_targets: "--target-list=i386-softmmu,x86_64-softmmu,i386-linux-user,x86_64-linux-user"
qemu_source_url: "https://download.qemu.org/qemu-{{ qemu_version }}.tar.xz"
qemu_build_dir: "/tmp/qemu-{{ qemu_version }}"

# Anti-VM replacement strings
qemu_cpuid: "Intel(R) Core(TM) i3-4130 CPU"
qemu_hypervisor_string: "GenuineIntel"
qemu_hd_replacement: "SAMSUNG MZ76E120"
qemu_dvd_replacement: "HL-PQ-SV WB8"
qemu_bochs_cpu_replacement: "INTELCPU"
qemu_pen_replacer: "<WOOT>"
qemu_scsi_replacer: "<WOOT>"
qemu_atapi_replacer: "<WOOT>"
qemu_microdrive_replacer: "<WOOT>"
qemu_bochs_block_replacer: "<WOOT>"
qemu_bxpc_replacer: "<WOOT>"
qemu_acpi_bios_replacer: "ALASKA"
qemu_bochs_cpu: "INTEL/INTEL"
qemu_space_replacement: "intel "
qemu_bios_date: "07/02/18"
qemu_bios_date2: "11/03/2018"
qemu_fw_date: "11/03/2018"
deb_architecture: "{{ 'amd64' if ansible_architecture == 'x86_64' else ansible_architecture }}"

# ────────────────────────────────────────────────────────────────────
# SeaBIOS
# ────────────────────────────────────────────────────────────────────

seabios_version: "1.16.3"
seabios_source_url: "https://github.com/coreboot/seabios/archive/refs/tags/rel-{{ seabios_version }}.tar.gz"
seabios_checksum: ""

# SeaBIOS anti-VM replacement strings
seabios_bochs_replacer: "<WOOT>"
seabios_bxpc_replacer: "<WOOT>"
seabios_bochs_block_replacer: "<WOOT>"
seabios_bochs_block_replacer2: "<WOOT>"
seabios_bochs_block_replacer3: "<WOOT>"
seabios_bios_date: "07/02/18"
seabios_bios_date2: "11/03/2018"
seabios_fw_date: "11/03/2018"

# ────────────────────────────────────────────────────────────────────
# Libvirt
# ────────────────────────────────────────────────────────────────────

libvirt_version: "11.1.0"
libvirt_source_url: "https://libvirt.org/sources/libvirt-{{ libvirt_version }}.tar.xz"
libvirt_python_url: "https://github.com/libvirt/libvirt-python/archive/v{{ libvirt_version }}.zip"
libvirt_build_dir: "/tmp/libvirt-{{ libvirt_version }}"
libvirt_so_path: ""
libvirt_firewall_backend: "iptables"
libvirt_install_method: "apt"  # "source" or "apt"

# virbr1 network
virbr1_network: "192.168.1"
virbr1_gateway: "192.168.1.1"
virbr1_netmask: "255.255.255.0"
virbr1_dhcp_start: "192.168.1.2"
virbr1_dhcp_end: "192.168.1.254"
