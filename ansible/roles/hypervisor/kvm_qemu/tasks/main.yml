---
- name: Gather package facts
  ansible.builtin.package_facts:
  when: ansible_facts.packages is not defined

- name: Check if QEMU is already at target version
  ansible.builtin.command:
    cmd: qemu-system-x86_64 --version
  changed_when: false
  failed_when: false
  register: qemu_check

- name: Set fact for QEMU installation status
  ansible.builtin.set_fact:
    qemu_needs_build: "{{ qemu_check.rc != 0 or qemu_version not in qemu_check.stdout }}"

- name: Install build dependencies
  ansible.builtin.apt:
    pkg:
      - python3-pip
      - ninja-build
      - libssh2-1-dev
      - vde2
      - liblzo2-dev
      - libsnappy-dev
      - libbz2-dev
      - libxml2-dev
      - libgoogle-perftools-dev
      - libvde-dev
      - python3-sphinx-rtd-theme
      - debhelper
      - libusb-1.0-0-dev
      - libxen-dev
      - uuid-dev
      - xfslibs-dev
      - libjpeg-dev
      - libusbredirparser-dev
      - device-tree-compiler
      - texinfo
      - libbluetooth-dev
      - libbrlapi-dev
      - libcap-ng-dev
      - libcurl4-gnutls-dev
      - libfdt-dev
      - gnutls-dev
      - libiscsi-dev
      - libncurses5-dev
      - libnuma-dev
      - libcacard-dev
      - librados-dev
      - librbd-dev
      - libsasl2-dev
      - libseccomp-dev
      - libspice-server-dev
      - libaio-dev
      - libcap-dev
      - libattr1-dev
      - libpixman-1-dev
      - libxml2-utils
      - systemtap-sdt-dev
      - uml-utilities
      - libcapstone-dev
      - libgtk-3-dev
      - python3-sphinx
      - git
      - acpica-tools
    state: present
    update_cache: true
    cache_valid_time: 3600

- name: Install Perl podlators for docs
  ansible.builtin.command:
    cmd: perl -MCPAN -e "install 'Perl/perl-podlators'"
  changed_when: false
  failed_when: false
  when: "'podlators' not in ansible_facts.packages | default({})"

- name: Install sphinx and ninja via apt (more reliable than pip on restricted networks)
  ansible.builtin.apt:
    pkg:
      - python3-sphinx
      - ninja-build
    state: present

- name: Block — QEMU build
  when: qemu_needs_build
  block:
    - name: Purge existing QEMU packages
      ansible.builtin.shell:
        cmd: dpkg -l 2>/dev/null | awk '/^ii/ && /qemu/ {print $2}' | xargs -r dpkg --purge --force-all
      register: qemu_purge
      changed_when: qemu_purge.rc == 0
      failed_when: false

    - name: Remove old QEMU share directory and build artifacts
      ansible.builtin.file:
        path: "{{ item }}"
        state: absent
      loop:
        - /usr/share/qemu
        - "{{ qemu_build_dir }}"
        - "/tmp/qemu-{{ qemu_version }}_builded"
        - "/tmp/qemu-{{ qemu_version }}_builded.deb"

    - name: Download QEMU source tarball
      ansible.builtin.get_url:
        url: "{{ qemu_source_url }}"
        dest: "/tmp/qemu-{{ qemu_version }}.tar.xz"
        timeout: 120

    - name: Extract QEMU source
      ansible.builtin.unarchive:
        src: "/tmp/qemu-{{ qemu_version }}.tar.xz"
        dest: /tmp
        remote_src: true
        creates: "/tmp/qemu-{{ qemu_version }}/configure"

    - name: Apply anti-VM string replacements
      ansible.builtin.shell:
        cmd: |
          set -e
          cd /tmp/qemu-{{ qemu_version }}
          _sed() { [ -f "$2" ] && sed -i "$1" "$2" || true; }
          _sed "s/QEMU HARDDISK/{{ qemu_hd_replacement }}/g" hw/ide/core.c
          _sed "s/QEMU HARDDISK/{{ qemu_hd_replacement }}/g" hw/scsi/scsi-disk.c
          _sed "s/QEMU DVD-ROM/{{ qemu_dvd_replacement }}/g" hw/ide/core.c
          _sed "s/QEMU DVD-ROM/{{ qemu_dvd_replacement }}/g" hw/ide/atapi.c
          _sed "s/QEMU PenPartner tablet/{{ qemu_pen_replacer }} PenPartner tablet/g" hw/usb/dev-wacom.c
          _sed "s/KVMKVMKVM\\\0\\\0\\\0/{{ qemu_hypervisor_string }}/g" target/i386/kvm/kvm.c
          _sed 's/s->vendor = g_strdup("QEMU");/s->vendor = g_strdup("{{ qemu_scsi_replacer }}");/g' hw/scsi/scsi-disk.c
          _sed "s/QEMU CD-ROM/{{ qemu_dvd_replacement }}/g" hw/scsi/scsi-disk.c
          _sed 's/padstr8(buf + 8, 8, "QEMU");/padstr8(buf + 8, 8, "{{ qemu_atapi_replacer }}");/g' hw/ide/atapi.c
          _sed "s/QEMU MICRODRIVE/{{ qemu_microdrive_replacer }} MICRODRIVE/g" hw/ide/core.c
          _sed 's/"bochs"/"{{ qemu_bochs_block_replacer }}"/g' block/bochs.c
          _sed 's/"BOCHS "/"{{ qemu_acpi_bios_replacer }}"/g' include/hw/acpi/aml-build.h
          _sed 's/Bochs Pseudo/Intel RealTime/g' roms/ipxe/src/drivers/net/pnic.c
          _sed "s/BXPC/{{ qemu_bxpc_replacer }}/g" include/hw/acpi/aml-build.h
      changed_when: true
      args:
        executable: /bin/bash

    - name: Build bundled SeaBIOS and VGA BIOS
      ansible.builtin.shell:
        cmd: |
          set -e
          cd /tmp/qemu-{{ qemu_version }}/roms
          sed -i 's/CONFIG_XEN=y/CONFIG_XEN=n/g' ./config.seabios-microvm
          sed -i 's/CONFIG_XEN=y/CONFIG_XEN=n/g' ./config.seabios-128k
          sed -i 's/PYTHON=python/PYTHON=python3/g' seabios/Makefile
          make bios
          make vgabios
      args:
        executable: /bin/bash
      environment:
        PIP_BREAK_SYSTEM_PACKAGES: "1"

    - name: Configure QEMU build
      ansible.builtin.command:
        cmd: |
          ./configure {{ qemu_targets }} \
            --prefix=/usr \
            --libexecdir=/usr/lib/qemu \
            --localstatedir=/var \
            --bindir=/usr/bin/ \
            --enable-gnutls \
            --enable-docs \
            --enable-gtk \
            --enable-vnc \
            --enable-vnc-sasl \
            --enable-curl \
            --enable-kvm \
            --enable-linux-aio \
            --enable-cap-ng \
            --enable-vhost-net \
            --enable-vhost-crypto \
            --enable-spice \
            --enable-usb-redir \
            --enable-lzo \
            --enable-snappy \
            --enable-bzip2 \
            --enable-coroutine-pool \
            --enable-replication \
            --enable-tools
        chdir: "/tmp/qemu-{{ qemu_version }}"
        creates: "/tmp/qemu-{{ qemu_version }}/build"
      register: qemu_configure

    - name: Compile QEMU
      ansible.builtin.command:
        cmd: "make -j{{ ansible_processor_vcpus | default(1) }}"
        chdir: "/tmp/qemu-{{ qemu_version }}"
      register: qemu_make
      timeout: 3600

    - name: Create staging directory for .deb packaging
      ansible.builtin.file:
        path: "/tmp/qemu-{{ qemu_version }}_builded/DEBIAN"
        state: directory

    - name: Write debian control file
      ansible.builtin.copy:
        dest: "/tmp/qemu-{{ qemu_version }}_builded/DEBIAN/control"
        content: |
          Package: qemu
          Version: {{ qemu_version }}
          Architecture: {{ deb_architecture }}
          Maintainer: CAPEv2 Ansible
          Description: Custom anti-VM QEMU for CAPEv2
        mode: "0644"

    - name: Install QEMU to staging directory
      ansible.builtin.command:
        cmd: "make -j{{ ansible_processor_vcpus | default(1) }} install DESTDIR=/tmp/qemu-{{ qemu_version }}_builded"
        chdir: "/tmp/qemu-{{ qemu_version }}"
      timeout: 600

    - name: Build .deb package
      ansible.builtin.command:
        cmd: dpkg-deb --build --root-owner-group /tmp/qemu-{{ qemu_version }}_builded
        chdir: /tmp
      register: deb_build

    - name: Install QEMU .deb with force-overwrite
      ansible.builtin.apt:
        deb: "/tmp/qemu-{{ qemu_version }}_builded.deb"
        dpkg_options: "force-overwrite"
        state: present

    - name: Remove QEMU logo file
      ansible.builtin.file:
        path: /usr/share/qemu/qemu_logo_no_text.svg
        state: absent

    - name: Create qemu-system-x86_64-spice symlink
      ansible.builtin.file:
        src: /usr/bin/qemu-system-x86_64
        dest: /usr/bin/qemu-system-x86_64-spice
        state: link

    - name: Create kvm-spice symlink
      ansible.builtin.file:
        src: /usr/bin/qemu-system-x86_64
        dest: /usr/bin/kvm-spice
        state: link

    - name: Create kvm symlink
      ansible.builtin.file:
        src: /usr/bin/qemu-system-x86_64
        dest: /usr/bin/kvm
        state: link

    - name: Hold QEMU packages to prevent accidental upgrades
      ansible.builtin.dpkg_selections:
        name: qemu
        selection: hold

    - name: Notify reboot required
      ansible.builtin.debug:
        msg: "QEMU installed — reboot recommended but not forced"
