---
# ────────────────────────────────────────────────────────────────────
# Per-guest VM creation — called from vm_create.yml via include_tasks
# loop.  _guest_name is the inventory host name from [cape_guests].
#
# Relies on host vars from the inventory entry:
#   libvirt_name, guest_ip, vm_ram_mb, vm_cpu, vm_disk_gb,
#   vm_os_variant, vm_wim_index
#
# Also uses the shared fact: windows_iso_final
# ────────────────────────────────────────────────────────────────────

- name: Look up guest host vars
  ansible.builtin.set_fact:
    _guest: "{{ hostvars[_guest_name] }}"

# ── 1. Initial State Gathering ─────────────────────────────────────
- name: Check VM state and existence
  ansible.builtin.command: "virsh domstate {{ _guest.libvirt_name }}"
  register: _vm_state
  failed_when: false
  changed_when: false

- name: Skip existing VM creation
  ansible.builtin.debug:
    msg: "VM '{{ _guest.libvirt_name }}' already exists — skipping creation"
  when: _vm_state.rc == 0

- name: Set per-guest vm_wim_index for answer ISO
  ansible.builtin.set_fact:
    _guest_vm_wim_index: "{{ _guest.vm_wim_index | default(6) }}"

# ── 2. VM Creation Block (Runs only if VM is missing) ──────────────
- name: Include answer ISO generation
  ansible.builtin.include_role:
    name: guest_provisioning
    tasks_from: autounattend.yml
  vars:
    vm_wim_index: "{{ _guest_vm_wim_index }}"
  tags:
    - vm_create
  when: _vm_state.rc != 0

- name: Create KVM guest with virt-install (unattended)
  ansible.builtin.command:
    cmd: >
      virt-install
        --name={{ _guest.libvirt_name }}
        --memory={{ _guest.vm_ram_mb | default(vm_ram_mb) }}
        --vcpus={{ _guest.vm_cpu | default(vm_cpu) }}
        --disk size={{ _guest.vm_disk_gb | default(vm_disk_gb) }}
        --cdrom={{ windows_iso_final }}
        --disk path={{ autounattend_tmp_dir.path }}/autounattend.iso,device=cdrom
        --os-variant={{ _guest.vm_os_variant | default(vm_os_variant) }}
        --network network={{ _guest.vm_bridge | default(vm_bridge) }}
        --machine pc-i440fx-9.2
        --graphics spice,port=-1,listen=0.0.0.0
        --noautoconsole
        --wait=0
        --check all=off
  when: _vm_state.rc != 0
  register: _vm_create
  changed_when: "'Domain installation may still be in progress' in _vm_create.stdout or 'Domain created' in _vm_create.stdout"
  failed_when:
    - _vm_create.rc != 0
    - "'Domain already exists' not in _vm_create.stderr"

- name: Display VM creation result
  ansible.builtin.debug:
    var: _vm_create.stdout_lines
  when: _vm_create is changed

# ── 3. Wait for Unattended Installation (only for newly created VM) ──
- name: Check if 'clean' snapshot already exists
  ansible.builtin.command: "virsh snapshot-info {{ _guest.libvirt_name }} clean"
  register: _snapshot_check
  failed_when: false
  changed_when: false

- name: Wait for unattended Windows installation to complete and shut down
  ansible.builtin.command: "virsh domstate {{ _guest.libvirt_name }}"
  register: _install_wait
  until: "'shut off' in _install_wait.stdout"
  retries: 90
  delay: 30
  when:
    - _snapshot_check.rc != 0
    - _vm_state.rc != 0
  changed_when: false
  ignore_errors: true

- name: Force shut down if installation timed out
  ansible.builtin.command: "virsh destroy {{ _guest.libvirt_name }}"
  when:
    - _snapshot_check.rc != 0
    - _vm_state.rc != 0
    - _install_wait is defined
    - "'shut off' not in _install_wait.stdout"
  failed_when: false

# ── 4. Snapshot Remediation Block (Runs only if snapshot is missing)
- name: Prepare hardware and create snapshot
  when: _snapshot_check.rc != 0
  block:
    - name: Gather current VM state
      ansible.builtin.command: "virsh domstate {{ _guest.libvirt_name }}"
      register: _current_vm_state
      failed_when: false
      changed_when: false

    - name: Force VM offline for hardware modification
      ansible.builtin.command: "virsh destroy {{ _guest.libvirt_name }}"
      when: "'shut off' not in _current_vm_state.stdout"
      failed_when: false
      changed_when: true

    - name: Wait to confirm VM is fully powered off
      ansible.builtin.command: "virsh domstate {{ _guest.libvirt_name }}"
      register: _shutdown_check
      until: "'shut off' in _shutdown_check.stdout"
      retries: 6
      delay: 5
      when: "'shut off' not in _current_vm_state.stdout"
      changed_when: false

    - name: Find answer ISO device name
      ansible.builtin.shell:
        cmd: >
          virsh domblklist {{ _guest.libvirt_name }} --details
          | awk '/autounattend.iso/ {print $3}'
      register: _answer_iso_device
      changed_when: false

    - name: Detach setup answer ISO disk offline
      ansible.builtin.command: "virsh detach-disk {{ _guest.libvirt_name }} {{ _answer_iso_device.stdout }} --config"
      register: _detach_floppy
      failed_when: 
        - _detach_floppy.rc != 0
        - "'No disk found' not in _detach_floppy.stderr"
        - "'not found' not in _detach_floppy.stderr"
      changed_when: _detach_floppy.rc == 0

    - name: Start VM for running-state snapshot
      ansible.builtin.command: "virsh start {{ _guest.libvirt_name }}"
      register: _vm_start
      changed_when: "'started' in _vm_start.stdout"

    - name: Wait for VM to boot and CAPE agent to initialize
      ansible.builtin.pause:
        seconds: 120

    - name: Verify VM is reachable before creating snapshot
      ansible.builtin.command: "virsh domstate {{ _guest.libvirt_name }}"
      register: _vm_running_check
      failed_when: "'running' not in _vm_running_check.stdout"
      changed_when: false

    - name: Create 'clean' running-state snapshot
      ansible.builtin.command: >
        virsh snapshot-create-as {{ _guest.libvirt_name }}
        --name clean
        --description "Fresh Windows install with CAPE agent"
      register: _snapshot_create
      changed_when: "'Domain snapshot clean created' in _snapshot_create.stdout"

# ── 5. Cleanup ──────────────────────────────────────────────────────
- name: Remove autounattend staging directory
  ansible.builtin.file:
    path: "{{ autounattend_tmp_dir.path }}"
    state: absent
  when: autounattend_tmp_dir is defined