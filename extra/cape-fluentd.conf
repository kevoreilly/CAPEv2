# https://faun.pub/collecting-your-logs-to-stackdriver-in-gcp-basic-86772a0801c2

# set repo and update
# curl -sSO https://dl.google.com/cloudagents/add-logging-agent-repo.sh
# sudo bash add-logging-agent-repo.sh
# sudo apt-get update

# install
# sudo apt-get install -y google-fluentd google-fluentd-catch-all-config-structured

# Enable json_logs = on in conf/logging.conf (or export CAPE_JSON_LOGS=1), then copy this file to:
# sudo cp extra/cape-fluentd.conf /etc/google-fluentd/config.d/cape.conf
# sudo service google-fluentd start && sudo service google-fluentd status && sudo service google-fluentd restart

<source>
  @type tail
  format json
  time_key time
  time_format %Y-%m-%dT%H:%M:%S.%N%Z
  keep_time_key false
  path /opt/CAPEv2/log/process.json.log
  pos_file /var/lib/google-fluentd/pos/cape-process-json.pos
  read_from_head true
  tag cape-processing
</source>

