[project]
name = "CAPEv2"
version = "0.1.0"
description = "CAPE: Malware Configuration And Payload Extraction"
authors = [
    { name = "Kevin O'Reilly", email = "kev@capesandbox.com" },
    { name = "doomedraven", email = "doomedraven@capesandbox.com" },
]
license = { text = "MIT" }
requires-python = ">=3.10, <4.0"
dependencies = [
    "alembic==1.9.4",
    "gevent>=24.2.1",
    "greenlet>=3.0.3",
    "Pebble==5.2.3",
    # "pymisp==2.4.144",
    "cryptography>=50.0.0",
    "requests[security,socks]>=2.33.0",
    # "pyOpenSSL==24.0.0",
    "pefile",
    "tldextract>=5.1.2",
    "oletools>=0.60.2",
    "olefile==0.47",
    "msoffcrypto-tool>=6.0.0",
    # "mixbox==1.0.5",
    "capstone==5.0.5",
    "pycryptodomex>=3.20.0",
    # "xmltodict==0.12.0",
    "requests-file>=1.5.1",
    "orjson>=3.9.15",
    # "maec==4.1.0.17",
    # "regex==2021.7.6",
    "SFlock2[linux,shellcode]>=0.3.84",
    # "volatility3==2.11.0",
    # "XLMMacroDeobfuscator==0.2.7",
    "pyzipper>=0.4.0",
    "flare-capa==10.0.0",
    "Cython==3.0.11",
    "Django>=5.2.17",
    "SQLAlchemy==2.0.41",
    "SQLAlchemy-Utils==0.41.1",
    "Jinja2>=3.1.6",
    "chardet==4.0.0",
    "pygal==2.4.0",
    "dpkt==1.9.6",
    "dnspython>=2.7.0",
    "pytz>=2021.1",
    "maxminddb>=2.6.3",
    "Pillow>=12.3.0",
    "python-whois==0.9.5",
    "bs4==0.0.1",
    "pydeep2==0.5.1",
    "django-recaptcha==4.0.0",  # https://pypi.org/project/django-recaptcha/
    "django-crispy-forms==2.3",
    "crispy-bootstrap4==2024.10",
    "django-settings-export==1.2.1",
    "django-csp==3.8",
    "django-extensions==3.2.3",
    "django-ratelimit==4.1.0",
    # "qrcode==7.2",
    "python-tlsh==4.5.0",
    "djangorestframework>=3.17.2",
    "yara-python>=4.5.1",
    "pymongo>=4.18.2",
    # "ImageHash==4.3.1",
    "LnkParse3==1.5.0",
    "cachetools>=5.5.1",
    "django-allauth>=65.14.1",  # https://django-allauth.readthedocs.io/en/latest/configuration.html
    # "socks5man @ git+https://github.com/CAPESandbox/socks5man.git@7b335d027297b67abdf28f38cc7d5d42c9d810b5",
    "binGraph @ https://github.com/CAPESandbox/binGraph/archive/refs/tags/4.0.tar.gz",
    "psycopg[binary]>=3.2.4",
    "ruff>=0.7.2",
    "paramiko==3.5.0",
    "psutil>=6.1.1",
    "peepdf-3==5.0.0",
    "pyre2==0.3.10; python_version < '3.11'",
    "pyre2>=0.3.14; python_version >= '3.11'",
    "Werkzeug>=3.1.9",
    "packaging>=24.2",
    "setuptools>=83.0.0",
    # command line config manipulation
    "crudini==0.9.5",
    "python-dateutil==2.9.0.post0",
    "python-msi>=0.0.0a3",
    # guac-session
    "pyguacamole>=0.11",
    "uvicorn[standard]>=0.18.2",
    "gunicorn>=23.0.0",
    "channels[daphne]>=4.0.0",
    "setproctitle>=1.3.2",
    "CAPE-parsers>=0.1.36",
    "maco==1.1.8",
]

[project.optional-dependencies]
maco = ["maco"]
gcp = ["google-cloud-storage", "google-cloud-pubsub"]
s3 = ["boto3"]
yara = ["plyara"]
mcp = ["fastmcp", "httpx"]
azure = [
    "azure-identity",
    "msrest",
    "msrestazure",
    "azure-mgmt-compute",
    "azure-mgmt-network",
    "azure-mgmt-storage",
    "azure-storage-blob",
]

[dependency-groups]
dist = [
    "fastapi",
]
dev = [
    "black>=24.3.0",
    "isort>=5.10.1",
    "ty>=0.0.99",
    "pytest>=9.0.3",
    "pytest-pretty>=1.2.0",
    "pytest-cov>=5.0.0",
    "pytest-mock>=3.14.0",
    "pytest-django>=4.9.0",
    "pytest-asyncio>=0.24.0",
    "pytest-xdist==3.6.1",
    "pytest-freezer==0.4.8",
    "tenacity==8.1.0",
    "types-requests>=2.32",
    "httpretty>=1.1.4",
    "func-timeout>=4.3.5",
    "pre-commit>=2.19.0",
]

[tool.poetry]
package-mode = false

[tool.uv]
package = false

[tool.black]
line-length = 132
include = "\\.py(_disabled)?$"

[tool.isort]
profile = "black"
no_lines_before = ["FUTURE", "STDLIB"]
line_length = 132
supported_extensions = ["py", "py_disabled"]

[tool.flake8]
max-line-length = 132
exclude = ".git,__pycache__,.cache,.venv"

[tool.pytest.ini_options]
django_find_project = false
DJANGO_SETTINGS_MODULE = "web.settings"
pythonpath = [".", "web"]
testpaths = ["tests", "agent"]
norecursedirs = "tests/zip_compound"
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
filterwarnings = [
    "ignore:_pytest\\.python\\.CallSpec2 has been renamed to CallSpec:pytest.PytestRemovedIn10Warning",
    "ignore::DeprecationWarning:oletools\\..*",
    "ignore:The 'u' type code is deprecated:DeprecationWarning:pymsi\\..*",
    "ignore:datetime\\.datetime\\.utcfromtimestamp\\(\\) is deprecated:DeprecationWarning:pytz\\..*",
    "ignore:datetime\\.datetime\\.utcnow\\(\\) is deprecated:DeprecationWarning:httpretty\\..*",
    "ignore:This process \\(pid=\\d+\\) is multi-threaded, use of fork\\(\\) may lead to deadlocks in the child:DeprecationWarning",
]

[build-system]
requires = ["poetry-core>=1.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.ruff]
line-length = 132
exclude = [
    "./analyzer/linux/dbus_next",
]

[tool.ruff.lint]
select = [
	"F",       # pyflakes
	"E",       # pycodestyle errors
	"W",       # pycodestyle warnings
	# "I",       # isort
	# "N",       # pep8-naming
	"G",       # flake8-logging-format
]

ignore = [
    "E501",    # ignore due to conflict with formatter
    "N818",    # exceptions don't need the Error suffix
    "E741",    # allow ambiguous variable names
    "E402",
    "W605",    # ToDo to fix - Invalid escape sequence
]

fixable = ["ALL"]

[tool.ruff.lint.per-file-ignores]
"stubs/*" = [
    "N",       # naming conventions don't matter in stubs
    "F403",    # star imports are okay in stubs
    "F405",    # star imports are okay in stubs
]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false
line-ending = "auto"

[tool.ruff.lint.isort]
known-first-party = ["libqtile", "test"]
default-section = "third-party"

[tool.ty.environment]
extra-paths = ["agent"]

[tool.ty.src]
include = ["agent/**/*.py"]
