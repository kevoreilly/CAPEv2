{% load generic_tags %}
{% load analysis_tags %}

<div class="card bg-dark border-secondary mb-3 shadow-sm">
    <div class="card-header border-secondary d-flex justify-content-between align-items-center bg-transparent py-3">
        <h5 class="mb-0 text-white"><i class="fas fa-sitemap me-2 text-info"></i>Interactive Process Tree</h5>
        <span class="badge bg-secondary">D3.js Collapsible</span>
    </div>
    <div class="card-body p-0" style="background: #111; border-bottom-left-radius: 0.375rem; border-bottom-right-radius: 0.375rem;">
        <div id="process-tree-viz" class="custom-scrollbar" style="width: 100%; max-height: 550px; overflow-y: auto; overflow-x: auto; padding: 15px 0;"></div>
    </div>
</div>

{{ behavior.processtree|json_script:"process-tree-data" }}

<script type="text/javascript">
(function() {
    const data = JSON.parse(document.getElementById('process-tree-data').textContent);
    if (!data || data.length === 0) return;

    // Support multiple root nodes by wrapping in a virtual root if needed
    const rootData = data.length > 1 ? { name: "Analysis Root", pid: 0, children: data } : data[0];

    const container = document.getElementById('process-tree-viz');
    const width = container.clientWidth;
    const margin = {top: 20, right: 30, bottom: 20, left: 30};

    const dx = 32; // Vertical spacing per node
    const dy = 24; // Horizontal indentation per level

    const root = d3.hierarchy(rootData);
    root.eachBefore((d, i) => {
        d.id = i;
        d._children = d.children;
        // Keep top levels expanded, but collapse deeper levels by default to keep clean
        if (d.depth > 3) d.children = null;
    });

    const svg = d3.select("#process-tree-viz").append("svg")
        .attr("width", "100%")
        .style("font-family", "SFMono-Regular, Menlo, Monaco, Consolas, 'Liberation Mono', 'Courier New', monospace")
        .style("font-size", "13px")
        .style("user-select", "none");

    const gLink = svg.append("g")
        .attr("fill", "none")
        .attr("stroke", "#444")
        .attr("stroke-width", 1.5);

    const gNode = svg.append("g");

    function update() {
        const nodes = [];
        function recurse(node) {
            nodes.push(node);
            if (node.children) {
                node.children.forEach(recurse);
            }
        }
        recurse(root);

        // Assign vertical and horizontal positions
        nodes.forEach((node, i) => {
            node.x = i * dx + margin.top;
            node.y = node.depth * dy + margin.left;
        });

        const newHeight = nodes.length * dx + margin.top + margin.bottom;
        svg.attr("height", newHeight);

        const transition = svg.transition().duration(250);

        // Update nodes
        const node = gNode.selectAll("g")
            .data(nodes, d => d.id);

        const nodeEnter = node.enter().append("g")
            .attr("transform", d => `translate(${d.y},${d.x})`)
            .attr("fill-opacity", 0)
            .attr("stroke-opacity", 0)
            .attr("cursor", d => d._children ? "pointer" : "default")
            .on("click", (event, d) => {
                // Toggle children on click
                if (d._children) {
                    d.children = d.children ? null : d._children;
                    update();
                }
            });

        // Toggle Folder/Node indicator (Plus/Minus)
        nodeEnter.append("path")
            .attr("d", d => d.children ? "M-4,0 H4" : "M-4,0 H4 M0,-4 V4")
            .attr("stroke", d => d._children ? "#0dcaf0" : "#999")
            .attr("stroke-width", 2)
            .attr("fill", "none")
            .attr("class", "toggle-icon")
            .style("display", d => d._children ? "inline" : "none");

        // Small dot for leaf nodes (no children)
        nodeEnter.append("circle")
            .attr("r", 3)
            .attr("fill", "#666")
            .style("display", d => d._children ? "none" : "inline");

        // Label group container
        const textGroup = nodeEnter.append("g")
            .attr("transform", "translate(12, 4)");

        // Process Name text
        textGroup.append("text")
            .attr("fill", d => d.data.pid === 0 ? "#6c757d" : "#ffffff")
            .style("font-weight", d => d._children ? "bold" : "normal")
            .text(d => d.data.name);

        // PID badge/text
        textGroup.append("text")
            .attr("dx", d => d.data.name.length * 8 + 12)
            .attr("fill", "#0dcaf0")
            .style("font-size", "11px")
            .style("font-weight", "bold")
            .text(d => d.data.pid ? `(${d.data.pid})` : "");

        // Command line (if present)
        textGroup.append("text")
            .attr("dx", d => {
                const nameLen = d.data.name.length * 8;
                const pidLen = d.data.pid ? String(d.data.pid).length * 8 + 15 : 0;
                return nameLen + pidLen + 24;
            })
            .attr("fill", "#888")
            .style("font-size", "11px")
            .text(d => {
                const cmd = d.data.environ && d.data.environ.CommandLine ? d.data.environ.CommandLine : "";
                if (cmd && cmd.length > 140) return cmd.slice(0, 140) + "...";
                return cmd;
            });

        // Transition nodes
        node.merge(nodeEnter).transition(transition)
            .attr("transform", d => `translate(${d.y},${d.x})`)
            .attr("fill-opacity", 1)
            .attr("stroke-opacity", 1);

        // Update the fold icons (Minus if expanded, Plus if collapsed)
        node.merge(nodeEnter).select(".toggle-icon")
            .attr("d", d => d.children ? "M-4,0 H4" : "M-4,0 H4 M0,-4 V4");

        // Exit nodes
        node.exit().transition(transition).remove()
            .attr("fill-opacity", 0)
            .attr("stroke-opacity", 0);

        // Update links
        const links = [];
        nodes.forEach(d => {
            if (d.parent) {
                links.push({source: d.parent, target: d});
            }
        });

        const link = gLink.selectAll("path")
            .data(links, d => d.target.id);

        const linkEnter = link.enter().append("path")
            .attr("d", d => `M${d.source.y},${d.source.x} V${d.target.x} H${d.target.y}`);

        link.merge(linkEnter).transition(transition)
            .attr("d", d => `M${d.source.y},${d.source.x} V${d.target.x} H${d.target.y}`);

        link.exit().transition(transition).remove();
    }

    update();
})();
</script>
